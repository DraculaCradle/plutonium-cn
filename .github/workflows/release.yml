name: Publish Foundry release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['module.json', 'js/**', 'tools/module-files.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runtime syntax
        run: node --check js/Bundle.js
      - name: Build and validate release
        env:
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python tools/build-release.py --repository "$REPO" --tag "$REF_NAME"
          else
            python tools/build-release.py --repository "$REPO"
          fi
      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(python -c 'import json; print(json.load(open("module.json"))["version"])')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its published assets."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Plutonium CN $TAG" --notes-file RELEASE-NOTES.md --draft
          gh release upload "$TAG" dist/module.json dist/plutonium-cn.zip dist/plutonium-cn.zip.sha256
          gh release edit "$TAG" --draft=false --latest
